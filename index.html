<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <p class="subtitle">Current time in different time zones</p>
        
        <div class="controls">
            <div class="timezone-input">
                <input type="text" id="timezoneInput" placeholder="Enter timezone (e.g., America/New_York)">
                <button id="addBtn">Add Timezone</button>
            </div>
            <button id="resetBtn" class="reset-btn">Reset to Default</button>
        </div>

        <div class="clock-container" id="clockContainer">
            <!-- Clocks will be dynamically added here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
